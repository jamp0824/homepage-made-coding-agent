<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>주식회사 기록샘플</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="profile-page" data-template="company_intro_basic" data-template-variant="result_style_v1" data-content-density="standard" data-asset-theme="it_software">
      <header class="profile-nav" aria-label="생성 홈페이지 탐색">
        <div class="profile-brand-mark" aria-hidden="true">H</div>
        <nav aria-label="페이지 섹션">
          <a href="#company">기업</a>
          
          <a href="#contact">문의</a>
        </nav>
      </header>
      <div class="profile-action-row">
        <a class="profile-back-link" href="/">← 뒤로</a>
      </div>
      <article class="profile-hero-card">
        <section class="profile-cover" data-section="hero"><div class="cover-fallback" aria-hidden="true"></div></section>
        <section class="profile-summary" data-section="company_summary">
          <p class="eyebrow">IT·소프트웨어</p>
          <div class="profile-title-row">
            <h1>주식회사 기록샘플</h1>
          </div>
          <p>기업 업무 관리를 위한 소프트웨어</p>
          <div class="tag-row"><span>소프트웨어 개발 및 공급</span></div>
          <div class="profile-meta-row">
            <span>회사소개중심형</span>
            
          </div>
        </section>
      </article>
      
      <section id="company" class="info-card" data-section="company_intro"><h2>기업 소개</h2><p>업무 관리 소프트웨어를 통해 기업의 반복 업무를 정리합니다.</p></section>
      <section class="info-card profile-strength-card" data-section="core_strengths">
        <h2>핵심 강점</h2>
        <ul class="strength-grid"><li>업무 흐름 정리</li>
<li>운영 데이터 관리</li></ul>
      </section>
      <section class="info-card" data-section="history">
        <h2>연혁</h2>
        <ol class="timeline">
          <li><strong>2025</strong><span>업무 관리 소프트웨어 공급을 시작했습니다.</span></li>
        </ol>
      </section>
      <section class="info-card" data-section="portfolio">
        <h2>포트폴리오</h2>
        <div class="card-grid">
          <article class="portfolio-card"><span class="card-icon" aria-hidden="true">□</span><h3>업무 관리 시스템 구축</h3><p>기업 내부 업무 흐름을 정리하는 시스템을 구축했습니다.</p></article>
        </div>
      </section>
      
      <section id="contact" class="contact-cta profile-contact-card" data-section="contact_cta"><h2>문의하기</h2><p>주식회사 기록샘플의 사업과 서비스가 궁금하시다면 문의해 주세요.</p></section>
    </main>
  </body>
</html>
