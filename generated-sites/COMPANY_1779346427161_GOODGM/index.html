<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>치킨텐더스 주식회사</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="profile-page" data-template="company_intro_basic" data-template-variant="result_style_v1" data-content-density="standard" data-asset-theme="software_dashboard">
      <header class="profile-nav" aria-label="생성 홈페이지 탐색">
        <div class="profile-brand-mark" aria-hidden="true">H</div>
        <nav aria-label="페이지 섹션">
          <a href="#company">기업</a>
          
          <a href="#contact">문의</a>
        </nav>
      </header>
      <div class="profile-action-row">
        <a class="profile-back-link" href="/">← 뒤로</a>
      </div>
      <article class="profile-hero-card">
        <section class="profile-cover" data-section="hero"><div class="cover-fallback" aria-hidden="true"></div></section>
        <section class="profile-summary" data-section="company_summary">
          <p class="eyebrow">IT·소프트웨어</p>
          <div class="profile-title-row">
            <h1>치킨텐더스 주식회사</h1>
          </div>
          <p>중소기업의 재고 운영을 돕는 업무 자동화 서비스</p>
          <div class="tag-row"><span>IT·소프트웨어</span>
<span>AI</span>
<span>기반</span>
<span>재고관리</span>
<span>솔루션</span>
<span>AI 기반 재고관리 솔루션</span></div>
          <div class="profile-meta-row">
            <span>회사소개중심형</span>
            
          </div>
        </section>
      </article>
      
      <section id="company" class="info-card" data-section="company_intro"><h2>기업 소개</h2><p>치킨텐더스 주식회사는 중소기업의 입출고와 발주 업무를 돕는 AI 기반 재고관리 솔루션입니다.</p></section>
      <section class="info-card profile-strength-card" data-section="core_strengths">
        <h2>핵심 강점</h2>
        <ul class="strength-grid"><li>AI 기반 재고 관리</li>
<li>입출고 업무 효율화</li>
<li>발주 업무 자동화</li></ul>
      </section>
      
      
      
      <section id="contact" class="contact-cta profile-contact-card" data-section="contact_cta"><h2>문의하기</h2><p>치킨텐더스 주식회사의 사업과 서비스가 궁금하시다면 문의해 주세요.</p></section>
    </main>
  </body>
</html>
